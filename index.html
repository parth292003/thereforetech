<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Therefore Tech — Coming Soon</title>
<meta name="description" content="Therefore Tech — building technology faster &amp; better. Coming soon.">
<meta name="theme-color" content="#c9a24a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#c9a24a}
a{color:#111111}a:hover{color:#000000}
.tt-wrap{position:relative;overflow:hidden;isolation:isolate}
.tt-sky{position:absolute;inset:-10%;z-index:-3;
background:linear-gradient(180deg,#efcfc8 0%,#e8c3b6 20%,#ddb892 38%,#d2a955 54%,#c69a3e 70%,#a9873d 86%,#8c7236 100%);
background-size:100% 120%;animation:tt-sky 18s ease-in-out infinite alternate;will-change:background-position}
.tt-haze{position:absolute;inset:-20%;z-index:-2;
background:
radial-gradient(ellipse 40% 18% at 25% 58%,rgba(232,186,70,.55),transparent 70%),
radial-gradient(ellipse 35% 16% at 70% 64%,rgba(205,160,45,.6),transparent 70%),
radial-gradient(ellipse 30% 14% at 45% 78%,rgba(140,112,40,.5),transparent 70%),
radial-gradient(ellipse 45% 20% at 85% 82%,rgba(120,98,38,.45),transparent 70%),
radial-gradient(ellipse 30% 12% at 15% 88%,rgba(196,150,50,.5),transparent 70%);
animation:tt-drift 14s ease-in-out infinite alternate;will-change:transform}
.tt-haze.b{animation-duration:20s;animation-direction:alternate-reverse;opacity:.7;transform:scaleX(-1)}
.tt-blades{position:absolute;left:-10%;right:-10%;bottom:-4%;height:58%;z-index:-1;transform-origin:50% 100%;
background:
repeating-linear-gradient(90deg,rgba(110,88,30,0) 0 9px,rgba(110,88,30,.22) 9px 11px,rgba(110,88,30,0) 11px 23px),
repeating-linear-gradient(90deg,rgba(235,195,80,0) 0 14px,rgba(235,195,80,.25) 14px 16px,rgba(235,195,80,0) 16px 31px);
-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 45%);mask-image:linear-gradient(180deg,transparent 0%,#000 45%);
animation:tt-sway 4.5s ease-in-out infinite alternate;will-change:transform}
.tt-blades.b{height:44%;opacity:.8;animation-duration:6s;animation-delay:-2s}
@keyframes tt-sky{from{background-position:50% 0%}to{background-position:50% 100%}}
@keyframes tt-drift{0%{transform:translate3d(-4%,0,0) scale(1)}50%{transform:translate3d(2%,-1.5%,0) scale(1.06)}100%{transform:translate3d(5%,1%,0) scale(1.02)}}
@keyframes tt-sway{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
.tt-main{min-height:100vh;min-height:100svh}
.tt-coming{white-space:nowrap}
@media (max-width:600px){
.tt-blades{animation-duration:5.5s}
.tt-haze.b{display:none}
.tt-coming{white-space:normal}
}
@media (prefers-reduced-motion:reduce){
.tt-sky,.tt-haze,.tt-blades{animation:none}
}
</style>
</head>
<body>
<main class="tt-wrap tt-main" style="box-sizing: border-box; display: flex; flex-direction: column; font-family: 'Oswald', 'Arial Narrow', sans-serif; color: #111111; text-transform: uppercase">
<div class="tt-sky" aria-hidden="true"></div>
<div class="tt-haze" aria-hidden="true"></div>
<div class="tt-haze b" aria-hidden="true"></div>
<div class="tt-blades" aria-hidden="true"></div>
<div class="tt-blades b" aria-hidden="true"></div>
<header style="display: flex; justify-content: center; padding: 20px 16px 14px; border-bottom: 1px solid rgba(17,17,17,0.45)">
<a href="#" style="font-weight: 700; font-size: 18px; letter-spacing: 0.02em; text-decoration: none">Therefore Tech</a>
</header>
<section style="padding: 16px clamp(16px, 2vw, 32px) 20px; border-bottom: 1px solid rgba(17,17,17,0.45)">
<h1 style="margin: 0; font-weight: 700; font-size: clamp(44px, 8vw, 120px); line-height: 0.98; letter-spacing: -0.01em">Building<br>Technology</h1>
</section>
<section style="display: flex; justify-content: flex-end; text-align: right; padding: 18px clamp(16px, 2vw, 32px); border-bottom: 1px solid rgba(17,17,17,0.45)">
<p style="margin: 0; font-weight: 700; font-size: clamp(40px, 8vw, 120px); line-height: 1">Faster &amp; Better</p>
</section>
<section style="flex: 1 1 auto; display: flex; align-items: flex-end; padding: 24px clamp(16px, 2vw, 32px) clamp(24px, 4vw, 56px)">
<h2 class="tt-coming" style="margin: 0; width: 100%; font-weight: 700; font-size: clamp(72px, 17.5vw, 260px); line-height: 0.9; letter-spacing: -0.01em">Coming Soon</h2>
</section>
</main>
</body>
</html>
