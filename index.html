<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THEREFORE TECH</title>
<meta name="description" content="Therefore Tech — building technology faster &amp; better. Coming soon.">
<meta name="theme-color" content="#c9a24a">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#c9a24a;color:#111;font-family:'Roboto Condensed','Arial Narrow',sans-serif;text-transform:uppercase;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}

/* Background: video on top, animated gradient underneath as fallback */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg-anim{position:absolute;inset:-10%;
  background:linear-gradient(180deg,#efcfc8 0%,#e8c3b6 20%,#ddb892 38%,#d2a955 54%,#c69a3e 70%,#a9873d 86%,#8c7236 100%);
  background-size:100% 120%;animation:sky 18s ease-in-out infinite alternate}
.bg-haze{position:absolute;inset:-20%;
  background:
  radial-gradient(ellipse 40% 18% at 25% 58%,rgba(232,186,70,.55),transparent 70%),
  radial-gradient(ellipse 35% 16% at 70% 64%,rgba(205,160,45,.6),transparent 70%),
  radial-gradient(ellipse 30% 14% at 45% 78%,rgba(140,112,40,.5),transparent 70%),
  radial-gradient(ellipse 45% 20% at 85% 82%,rgba(120,98,38,.45),transparent 70%);
  animation:drift 14s ease-in-out infinite alternate}
.bg-poster{position:absolute;inset:0;background:center/cover no-repeat url("https://images.squarespace-cdn.com/content/v1/66047eabd776ed75d2ba5d81/36880446-e6ce-4869-bf7f-e0e3bf240e38/Fallback+Image.png?format=1500w")}
.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s ease}
.bg video.on{opacity:1}
@keyframes sky{from{background-position:50% 0}to{background-position:50% 100%}}
@keyframes drift{0%{transform:translate3d(-4%,0,0) scale(1)}50%{transform:translate3d(2%,-1.5%,0) scale(1.06)}100%{transform:translate3d(5%,1%,0) scale(1.02)}}

/* Layout */
.page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.pad{padding-left:clamp(16px,2.2vw,40px);padding-right:clamp(16px,2.2vw,40px)}
header{display:flex;justify-content:center;padding-top:22px;padding-bottom:16px}
.logo{font-weight:700;font-size:clamp(15px,1.4vw,20px);letter-spacing:.02em}
hr{border:0;border-top:1px solid #111;margin:0;opacity:.85}
h1,h2,p{margin:0}
.lead{font-weight:700;font-size:clamp(40px,7.4vw,120px);line-height:.98;letter-spacing:-.01em;padding-top:clamp(10px,1.4vw,22px);padding-bottom:clamp(10px,1.4vw,22px)}
.lead.right{text-align:right}
.bt{max-width:9ch}
.coming{flex:1 1 auto;display:flex;align-items:flex-end;padding-top:24px}
.coming h1{font-weight:800;font-size:clamp(64px,16.6vw,300px);line-height:.88;letter-spacing:-.015em;white-space:nowrap;width:100%}
footer{text-align:center;font-size:13px;letter-spacing:.06em;padding:clamp(18px,3vw,36px) 16px clamp(18px,2.4vw,28px)}

@media (max-width:600px){
  .coming h1{white-space:normal}
  .bg-haze{animation-duration:18s}
}
@media (prefers-reduced-motion:reduce){
  .bg-anim,.bg-haze{animation:none}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-anim"></div>
  <div class="bg-haze"></div>
  <div class="bg-poster"></div>
  <video id="bgv" muted loop playsinline autoplay preload="auto"></video>
</div>

<div class="page">
  <header class="pad"><a class="logo" href="/">THEREFORE TECH</a></header>
  <hr>
  <section class="pad"><h2 class="lead bt">Building technology</h2></section>
  <hr>
  <section class="pad"><h2 class="lead right">Faster &amp; Better</h2></section>
  <hr>
  <section class="coming pad"><h1>Coming Soon</h1></section>
  <footer>Owned by Parth Paliwal</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
(function(){
  var v=document.getElementById('bgv');
  // Local copy first (add bg.mp4 to the repo to self-host), then the Squarespace stream.
  var LOCAL='bg.mp4';
  var HLS='https://video.squarespace-cdn.com/content/v1/66047eabd776ed75d2ba5d81/03c59fb3-f66e-4787-9bf8-e10795ce4796/playlist.m3u8';
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  function show(){v.classList.add('on');var p=document.querySelector('.bg-poster');if(p)p.style.display='none'}
  v.addEventListener('playing',show);
  function tryHls(){
    if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=HLS;v.play().catch(function(){});return}
    if(window.Hls&&Hls.isSupported()){
      var h=new Hls({capLevelToPlayerSize:true});
      h.loadSource(HLS);h.attachMedia(v);
      h.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){})});
    }
  }
  v.addEventListener('error',function onErr(){v.removeEventListener('error',onErr);v.removeAttribute('src');tryHls()},{once:true});
  v.src=LOCAL;v.play().catch(function(){});
})();
</script>
</body>
</html>
