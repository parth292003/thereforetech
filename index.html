<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THEREFORE TECH</title>
<meta name="description" content="Therefore Tech — building technology faster &amp; better. Coming soon.">
<meta property="og:site_name" content="THEREFORE TECH">
<meta property="og:title" content="THEREFORE TECH">
<meta property="og:url" content="https://www.thereforetech.com">
<meta property="og:type" content="website">
<meta property="og:image" content="poster.jpg">
<meta name="theme-color" content="#c9a24a">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#b89a55;color:#111;font-family:'Roboto Condensed','Arial Narrow',sans-serif;text-transform:uppercase;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}

/* ---------- Background: field video, with poster + animated fallback ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#c9a24a}
.bg-anim{position:absolute;inset:-10%;
  background:linear-gradient(180deg,#efcfc8 0%,#e8c3b6 20%,#ddb892 38%,#d2a955 54%,#c69a3e 70%,#a9873d 86%,#8c7236 100%);
  background-size:100% 120%;animation:sky 18s ease-in-out infinite alternate}
.bg-poster{position:absolute;inset:0;background:center/cover no-repeat url("poster.jpg");
  animation:kenburns 24s ease-in-out infinite alternate;transform-origin:50% 70%}
.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
.bg video.on{opacity:1}
.bg-tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,235,228,.18) 0%,rgba(255,255,255,0) 45%,rgba(60,45,10,.12) 100%)}
@keyframes sky{from{background-position:50% 0}to{background-position:50% 100%}}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.08) translate3d(-1%,-1%,0)}}

/* ---------- Layout ---------- */
.page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.pad{padding-left:clamp(16px,2.4vw,44px);padding-right:clamp(16px,2.4vw,44px)}
header{display:flex;justify-content:center;align-items:center;padding-top:clamp(16px,1.8vw,24px);padding-bottom:clamp(12px,1.4vw,18px)}
.logo{font-weight:700;font-size:clamp(14px,1.25vw,19px);letter-spacing:.03em}
.rule{height:1px;background:#111;opacity:.8;transform-origin:left center;transform:scaleX(0);animation:draw 1.1s cubic-bezier(.65,0,.35,1) forwards}
.rule.r2{animation-delay:.35s;transform-origin:right center}
.rule.r3{animation-delay:.55s}
h1,h2,p{margin:0;font-weight:inherit}

.row{padding-top:clamp(12px,1.4vw,22px);padding-bottom:clamp(14px,1.8vw,28px)}
.lead{font-weight:800;font-size:clamp(38px,min(6.4vw,11vh),116px);line-height:.98;letter-spacing:-.01em}
.right{text-align:right}

/* line-mask reveal */
.mask{display:block;overflow:hidden;padding-bottom:.08em}
.mask>span{display:inline-block;transform:translate3d(0,110%,0);animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards}

.coming{flex:1 1 auto;display:flex;flex-direction:column;justify-content:flex-end;padding-top:clamp(16px,2.5vw,36px)}
.fit{width:100%;overflow:hidden}
.coming h1{display:inline-block;white-space:nowrap;font-weight:900;font-size:16vw;line-height:.86;letter-spacing:-.015em}
.coming .ch{display:inline-block;transform:translate3d(0,105%,0);opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.coming .sp{display:inline-block;width:.22em}
.coming.idle h1{animation:breathe 6s ease-in-out 2.6s infinite}

.tagline{text-align:center;font-weight:700;font-size:clamp(13px,1.15vw,17px);letter-spacing:.14em;padding-top:clamp(10px,1.4vw,20px);padding-bottom:max(clamp(14px,1.8vw,24px),env(safe-area-inset-bottom));opacity:0;animation:fade 1.2s ease 2.2s forwards}

@keyframes draw{to{transform:scaleX(1)}}
@keyframes rise{to{transform:translate3d(0,0,0);opacity:1}}
@keyframes fade{to{opacity:1}}
@keyframes breathe{0%,100%{letter-spacing:-.015em}50%{letter-spacing:.005em}}

@media (prefers-reduced-motion:reduce){
  .bg-anim,.bg-poster,.coming.idle h1{animation:none}
  .rule,.mask>span,.coming .ch,.tagline{animation:none;transform:none;opacity:1}
}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="bg-anim"></div>
  <div class="bg-poster"></div>
  <video id="bgv" muted loop playsinline autoplay preload="auto" poster="poster.jpg"><source src="bg.mp4" type="video/mp4"></video>
  <div class="bg-tint"></div>
</div>

<div class="page">
  <header class="pad"><a class="logo" href="/">THEREFORE TECH</a></header>
  <div class="rule"></div>

  <section class="row pad">
    <h2 class="lead">
      <span class="mask"><span style="animation-delay:.45s">Building</span></span>
      <span class="mask"><span style="animation-delay:.6s">Technology</span></span>
    </h2>
  </section>
  <div class="rule r2"></div>

  <section class="row pad">
    <h2 class="lead right"><span class="mask"><span style="animation-delay:.85s">Faster &amp; Better</span></span></h2>
  </section>
  <div class="rule r3"></div>

  <section class="coming pad" id="coming">
    <div class="fit"><h1 id="cs" aria-label="Coming Soon">Coming Soon</h1></div>
  </section>
  <p class="tagline pad">Owned by Parth Paliwal</p>
</div>

<script>
/* Split COMING SOON into letters for a staggered rise, then fit it to the full width */
(function(){
  var h=document.getElementById('cs'), txt=h.textContent, html='', d=1.15;
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(c===' '){html+='<span class="sp" aria-hidden="true"></span>';continue}
    html+='<span class="ch" aria-hidden="true" style="animation-delay:'+(d+i*0.055).toFixed(3)+'s">'+c+'</span>';
  }
  h.innerHTML=html;
  function fit(){
    var w=h.parentNode.clientWidth;if(!w)return;
    h.style.fontSize='100px';
    var tw=h.getBoundingClientRect().width;
    if(!tw)return;var fs=100*w/tw*0.995;var maxH=window.innerHeight*0.30/0.86;h.style.fontSize=Math.min(fs,Math.max(maxH,60))+'px';
  }
  fit();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
  window.addEventListener('resize',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,150)});
  setTimeout(function(){document.getElementById('coming').classList.add('idle')},2600);
})();
</script>
<script>
/* Field video background */
(function(){
  var v=document.getElementById('bgv');
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){v.removeAttribute('autoplay');v.pause();v.classList.add('on');return}
  function on(){v.classList.add('on')}
  v.addEventListener('playing',on);
  var p=v.play();if(p&&p.catch)p.catch(function(){});
  document.addEventListener('visibilitychange',function(){if(!document.hidden){var q=v.play();if(q&&q.catch)q.catch(function(){})}});
  document.addEventListener('touchstart',function(){var q=v.play();if(q&&q.catch)q.catch(function(){})},{once:true,passive:true});
})();
</script>
</body>
</html>
